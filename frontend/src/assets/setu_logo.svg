<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bracPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A9D"/>
      <stop offset="50%" stop-color="#EC008C"/>
      <stop offset="100%" stop-color="#A80062"/>
    </linearGradient>
  </defs>

  <!-- LOGO MARK: Suspension Bridge -->
  <g transform="translate(100, 25)">
    <!-- Water / Foundation Base Line -->
    <rect x="20" y="95" width="260" height="3" rx="1.5" fill="#F3D0D7" />

    <!-- Left Pier/Tower -->
    <rect x="85" y="30" width="10" height="65" fill="#EC008C" rx="1" />
    <!-- Right Pier/Tower -->
    <rect x="205" y="30" width="10" height="65" fill="#EC008C" rx="1" />

    <!-- Main Suspension Cables (Top Swoop) -->
    <path d="M 20,65 Q 85,30 85,30 Q 145,68 205,30 Q 205,30 280,65" 
          fill="none" stroke="#EC008C" stroke-width="4" stroke-linecap="round" />

    <!-- Vertical Suspension Hangers (Cables) -->
    <!-- Left span cables -->
    <line x1="45" y1="57" x2="45" y2="75" stroke="#EC008C" stroke-width="1.5" opacity="0.6" />
    <line x1="65" y1="46" x2="65" y2="75" stroke="#EC008C" stroke-width="1.5" opacity="0.6" />
    
    <!-- Center main span cables -->
    <line x1="110" y1="44" x2="110" y2="75" stroke="#EC008C" stroke-width="1.5" opacity="0.6" />
    <line x1="130" y1="55" x2="130" y2="75" stroke="#EC008C" stroke-width="1.5" opacity="0.6" />
    <line x1="150" y1="58" x2="150" y2="75" stroke="#EC008C" stroke-width="1.5" opacity="0.6" />
    <line x1="170" y1="55" x2="170" y2="75" stroke="#EC008C" stroke-width="1.5" opacity="0.6" />
    <line x1="190" y1="44" x2="190" y2="75" stroke="#EC008C" stroke-width="1.5" opacity="0.6" />

    <!-- Right span cables -->
    <line x1="235" y1="46" x2="235" y2="75" stroke="#EC008C" stroke-width="1.5" opacity="0.6" />
    <line x1="255" y1="57" x2="255" y2="75" stroke="#EC008C" stroke-width="1.5" opacity="0.6" />

    <!-- Bridge Deck / Roadway Curve -->
    <path d="M 20,78 Q 145,72 280,78" fill="none" stroke="url(#bracPink)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- TYPOGRAPHY -->
  <text 
    x="250" 
    y="165" 
    font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="52" 
    font-weight="800" 
    fill="#EC008C" 
    text-anchor="middle"
    letter-spacing="-0.5">
    Setu
  </text>

  <text 
    x="250" 
    y="198" 
    font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="15" 
    font-weight="600" 
    fill="#8A0051" 
    text-anchor="middle"
    letter-spacing="0.3">
    From SRS to Sprint-Ready Backlog
  </text>
</svg>
