server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Basic hardening. TLS itself is expected to terminate in front of this
    # container (a reverse proxy on the host), not here.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Vite fingerprints every built asset's filename with a content hash
    # (index-<hash>.js), so any file under /assets/ can be cached forever --
    # a new build never reuses an old filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is the one file that must NEVER be cached: it's what names
    # the current build's hashed asset files. A cached index.html after a
    # new deploy would point at JS/CSS that no longer exists -- the classic
    # "blank white page until you hard-refresh" SPA bug.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA routing: any path that isn't a real file falls back to index.html
    # so client-side navigation and refreshes on a deep link both work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
