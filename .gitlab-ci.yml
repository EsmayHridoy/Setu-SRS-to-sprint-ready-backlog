# =============================================================================
# Setu — GitLab CI/CD (image build only)
#
# Tag setu-production-* (created from staging OR main):
#   build backend + frontend images -> push to this project's GitLab registry
#
# Builds with Kaniko rather than docker-in-docker: this runner's dind service
# never came up cleanly (consistent "mount: permission denied" / "AppArmor
# detection and --privileged mode might break" on every attempt, regardless
# of TLS/network settings) -- the signature of a runner not configured for
# privileged containers. Kaniko builds a Dockerfile and pushes the result
# without ever needing a Docker daemon or privileged mode, which is why
# GitLab's own docs recommend it for exactly this situation.
#
# No deploy step here on purpose -- this pipeline stops once the images are in
# the registry. Wire up a separate deploy stage later once the hosting side
# (Hostinger) is ready to pull them.
#
# CI/CD Variables (Settings -> CI/CD -> Variables), all optional:
#   VITE_API_BASE_URL   the backend's public URL, baked into the frontend
#                        build (Vite reads it at build time, not runtime).
#                        Defaults to a localhost URL meant only for a local
#                        docker-compose setup -- override once the real
#                        backend URL is known.
# =============================================================================

stages:
  - validate
  - build

variables:
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  VITE_API_BASE_URL: "http://localhost:8001"

.tag_only:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^setu-production-/'

# Kaniko's image carries no git, so the tag-origin check runs here, in its
# own lightweight job, before either build starts.
check-tag-origin:
  extends: .tag_only
  stage: validate
  image: alpine/git:latest
  script:
    - |
      echo "Checking tag $CI_COMMIT_TAG was created from staging or main..."
      git fetch --unshallow 2>/dev/null || true
      git fetch origin staging main
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/staging"; then
        echo "OK: $CI_COMMIT_SHA is on staging."
      elif git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/main"; then
        echo "OK: $CI_COMMIT_SHA is on main."
      else
        echo "ERROR: Tag must be created from staging or main."
        exit 1
      fi

# `entrypoint: [""]` is required -- the kaniko image's own default entrypoint
# IS the executor, which would run immediately instead of waiting for the
# `script:` below. The `:debug` tag (not the plain kaniko image) is used
# specifically because it ships a shell; the script here needs one and the
# non-debug image has none at all.
.kaniko_build:
  extends: .tag_only
  stage: build
  needs: ["check-tag-origin"]
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    # Kaniko doesn't understand `docker login` -- it reads registry auth
    # straight out of this file instead, in plain Docker config.json shape.
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json

build-backend:
  extends: .kaniko_build
  script:
    - /kaniko/executor
        --context "$CI_PROJECT_DIR/backend"
        --dockerfile "$CI_PROJECT_DIR/backend/Dockerfile"
        --destination "$BACKEND_IMAGE:$CI_COMMIT_TAG"
        --destination "$BACKEND_IMAGE:latest"

build-frontend:
  extends: .kaniko_build
  script:
    - /kaniko/executor
        --context "$CI_PROJECT_DIR/frontend"
        --dockerfile "$CI_PROJECT_DIR/frontend/Dockerfile"
        --destination "$FRONTEND_IMAGE:$CI_COMMIT_TAG"
        --destination "$FRONTEND_IMAGE:latest"
        --build-arg "VITE_API_BASE_URL=$VITE_API_BASE_URL"
